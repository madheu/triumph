<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memory Cards | Triumph</title>
  <meta name="description" content="Spaced-repetition review cards built from your Praxis 5001 practice mistakes — review at 1, 3, 7, and 21 days.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://trytriumph.de5.net/srs">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    *, *::before, *::after { min-width: 0; }
    :root {
      --bg: #F2EFE9; --bg-soft: #E8E3D8; --ink: #3C3733; --ink-soft: #6E6760;
      --line: #D8D1C5; --accent: #C09D9B; --accent-deep: #A67D7A; --on-accent: #332E2B;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Instrument Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    html, body { height: 100%; width: 100%; overflow-x: hidden; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.75; }
    a { color: var(--accent-deep); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 40px; }
    @media (max-width: 760px) { .wrap { padding: 0 28px; } }

    .nav { display: flex; align-items: baseline; justify-content: space-between; padding: 28px 0 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 10px 18px; }
    .wordmark { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--ink); text-decoration: none; }
    .nav-note { font-size: 13px; color: var(--ink-soft); }
    .nav-cta { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
    @media (max-width: 760px) { .nav-note { display: none; } }

    .head { padding: 56px 0 20px; }
    .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 18px; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 5vw, 44px); line-height: 1.12; margin-bottom: 12px; }
    h1 em { font-style: italic; color: var(--accent); }
    .sub { color: var(--ink-soft); font-size: 15px; max-width: 38em; }

    .stats { display: flex; gap: 28px; padding: 22px 0; }
    .stat { font-family: var(--mono); }
    .stat .num { font-size: 26px; color: var(--accent); }
    .stat .lbl { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

    .card-box { background: var(--bg-soft); padding: 30px 32px; margin: 18px 0; }
    .card-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 12px; }
    .card-q { font-family: var(--serif); font-size: 22px; line-height: 1.4; margin-bottom: 20px; }
    .opt { display: block; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 10px; font-family: var(--sans); font-size: 15px; color: var(--ink); cursor: pointer; }
    .opt:hover { border-color: var(--accent); }
    .opt.correct { border-color: #6F9D7A; background: #E9F0EA; }
    .opt.wrong { border-color: #C9806F; background: #F5E7E3; }
    .opt:disabled { cursor: default; }
    .card-expl { font-size: 14px; color: var(--ink-soft); background: var(--bg); border-left: 2px solid var(--accent); padding: 12px 16px; margin: 14px 0 18px; }
    .card-actions { display: flex; gap: 12px; }
    .btn { flex: 1; padding: 12px 16px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
    .btn-again { background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
    .btn-good { background: var(--accent); color: var(--on-accent); }
    .btn-easy { background: var(--accent-deep); color: var(--bg); }
    .btn-again:hover { border-color: var(--ink); }
    .btn-good:hover { background: var(--accent-deep); color: var(--bg); }
    .btn-easy:hover { background: #8F6A67; }
    .btn:disabled { opacity: .5; cursor: wait; }

    .empty { text-align: center; padding: 60px 0; color: var(--ink-soft); }
    .empty .big { font-family: var(--serif); font-style: italic; font-size: 30px; color: var(--accent); margin-bottom: 12px; }
    .empty p { font-size: 15px; }

    .footer { padding: 48px 0 64px; border-top: 1px solid var(--line); margin-top: 48px; }
    .footer p { font-size: 12px; color: var(--ink-soft); line-height: 1.7; max-width: 60em; }

    @media (max-width: 560px) {
      .card-actions { flex-direction: column; }
      .card-box { padding: 22px 20px; }
    }
  </style>
  <link rel="stylesheet" href="css/mobile-enhance.css?v=20260821">
</head>
<body>
  <header class="nav wrap">
    <a class="wordmark" href="/">Triumph<span style="color:var(--accent)">.</span></a>
    <div style="display:flex; gap:24px; align-items:baseline;">
      <span class="nav-note">Memory cards · spaced repetition</span>
      <a class="nav-cta" href="dashboard">Dashboard</a>
      <a class="nav-cta" href="diagnostic">Free diagnostic →</a>
    </div>
  </header>

  <main id="root"></main>

  <script src="questions.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const A = window.TriumphAuth;
      const BANK = window.DM_BANK_EXT || [];
      const byId = {};
      BANK.forEach(q => { byId[q.id] = q; });

      const DAY = 86400000;
      const INTERVALS = [1, 3, 7, 21]; // 第 1/3/7/21 天复习

      // ---------- SRS 状态 ----------
      // 结构: triumph_srs = { [questionId]: { stage: 0..4, nextDue: ts, lastResult: 'again'|'good'|'easy', created: ts } }
      function loadSrs() { return A.localGet('triumph_srs', {}); }
      function saveSrs(srs) {
        A.localSet('triumph_srs', srs);
        if (A.isLoggedIn()) { const st = A.buildLocalState(); A.saveState(st).catch(() => {}); }
      }

      // 从错题生成卡片：每个错题 qid 若还没有卡片则创建（stage 0, 明天到期）
      function ensureCards() {
        const srs = loadSrs();
        const answers = A.localGet('triumph_answers', []);
        const wrongQids = new Set();
        answers.forEach(a => { if (!a.correct && byId[a.qid]) wrongQids.add(a.qid); });
        let created = 0;
        wrongQids.forEach(qid => {
          if (!srs[qid]) {
            srs[qid] = { stage: 0, nextDue: Date.now() + DAY, lastResult: null, created: Date.now() };
            created++;
          }
        });
        if (created > 0) saveSrs(srs);
        return { srs, created };
      }

      // 到期卡片：nextDue <= now，按到期时间排序
      function dueCards(srs) {
        const now = Date.now();
        return Object.keys(srs)
          .filter(qid => byId[qid] && srs[qid].nextDue <= now)
          .sort((a, b) => srs[a].nextDue - srs[b].nextDue);
      }

      // ---------- 渲染 ----------
      const root = document.getElementById('root');
      let state = { view: 'loading' }; // loading | empty | cards | done
      let cardQids = [];
      let cardIdx = 0;
      let picked = null; // { index }
      let answered = false;

      function render() {
        if (state.view === 'loading') {
          root.innerHTML = '<div class="wrap"><p style="padding:60px 0;color:var(--ink-soft)">Loading your cards…</p></div>';
          return;
        }
        if (state.view === 'empty') {
          root.innerHTML = `
            <div class="wrap">
              <div class="empty">
                <div class="big">Nothing due today.</div>
                <p>Your memory cards are built from questions you answered incorrectly. Miss a question in practice or the diagnostic, and it becomes a card due tomorrow — then again on day 3, 7, and 21.</p>
                <p style="margin-top:18px"><a href="practice">Practice now</a> · <a href="diagnostic">Take the diagnostic</a></p>
              </div>
            </div>`;
          return;
        }
        if (state.view === 'done') {
          root.innerHTML = `
            <div class="wrap">
              <div class="empty">
                <div class="big">All caught up.</div>
                <p>You reviewed <strong>${state.reviewed}</strong> card${state.reviewed === 1 ? '' : 's'} today. Cards come back on day 3, 7, and 21 to lock the memory in.</p>
                <p style="margin-top:18px"><a href="dashboard">Back to dashboard</a></p>
              </div>
            </div>`;
          return;
        }

        // cards view
        const remaining = cardQids.length - cardIdx;
        const qid = cardQids[cardIdx];
        const q = byId[qid];
        const srs = loadSrs();
        const meta = srs[qid];

        const optEls = q.options.map((opt, i) => {
          let cls = 'opt';
          let disabled = '';
          if (answered) {
            disabled = 'disabled';
            if (i === q.answer) cls += ' correct';
            else if (i === picked) cls += ' wrong';
          }
          return `<button class="${cls}" ${disabled} data-i="${i}">${String.fromCharCode(65 + i)}. ${opt}</button>`;
        }).join('');

        root.innerHTML = `
          <div class="wrap">
            <div class="head">
              <span class="eyebrow">Memory cards</span>
              <h1>Review what you <em>missed.</em></h1>
              <p class="sub">${remaining} card${remaining === 1 ? '' : 's'} due. Answer honestly — cards you miss come back sooner.</p>
            </div>
            <div class="card-box">
              <div class="card-tag">${q.code} · ${q.category || 'Practice'}</div>
              <div class="card-q">${q.q}</div>
              ${optEls}
              ${answered ? `<div class="card-expl"><strong>Explanation:</strong> ${q.explain || 'No explanation for this one.'}</div>
              <div class="card-actions">
                <button class="btn btn-again" data-r="again">Again (1 day)</button>
                <button class="btn btn-good" data-r="good">Good (next interval)</button>
                <button class="btn btn-easy" data-r="easy">Easy (skip to 21d)</button>
              </div>` : ''}
            </div>
            <div class="stats">
              <div class="stat"><div class="num">${remaining}</div><div class="lbl">left today</div></div>
              <div class="stat"><div class="num">${meta ? 'D' + (meta.stage + 1) : '—'}</div><div class="lbl">review stage</div></div>
            </div>
          </div>`;

        // 绑定选项点击
        root.querySelectorAll('.opt:not(:disabled)').forEach(btn => {
          btn.addEventListener('click', () => {
            picked = Number(btn.dataset.i);
            answered = true;
            render();
          });
        });
        // 绑定评分按钮
        root.querySelectorAll('[data-r]').forEach(btn => {
          btn.addEventListener('click', () => {
            const r = btn.dataset.r;
            const srs = loadSrs();
            const meta = srs[qid] || { stage: 0 };
            if (r === 'again') {
              meta.stage = 0;
              meta.nextDue = Date.now() + DAY;
            } else if (r === 'easy') {
              meta.stage = 4;
              meta.nextDue = Date.now() + 21 * DAY;
            } else {
              meta.stage = Math.min(meta.stage + 1, 4);
              const days = INTERVALS[Math.min(meta.stage, INTERVALS.length - 1)];
              meta.nextDue = Date.now() + days * DAY;
            }
            meta.lastResult = r;
            srs[qid] = meta;
            saveSrs(srs);
            cardIdx++;
            answered = false;
            picked = null;
            if (cardIdx >= cardQids.length) { state.view = 'done'; state.reviewed = cardQids.length; }
            render();
          });
        });
      }

      // ---------- 启动 ----------
      async function boot() {
        // 已登录：先拉云端
        if (A.isLoggedIn()) {
          try { await A.syncPull(); } catch (e) {}
        }
        const { srs } = ensureCards();
        const due = dueCards(srs);
        if (due.length === 0) {
          state.view = 'empty';
        } else {
          cardQids = due;
          cardIdx = 0;
          state.view = 'cards';
        }
        render();
      }

      boot();
    })();
  </script>
</body>
</html>
