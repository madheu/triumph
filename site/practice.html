<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex, nofollow">
  <title>Practice — Praxis 5001 Question Drills | Triumph</title>

  <!--
    ============================================================
    TRIUMPH · DIAGNOSTIC DEMO · v1 (interactive prototype)
    ============================================================
    - 目标: 演示 "做题 → 诊断 → 通过率预测 → 付费墙" 转化路径
    - 题库为 ORIGINAL mock questions（原创，不复制 ETS），标注 mock
    - scaled score / pass probability 是演示用简化模型，非真实算法
    - 真实题库/算法明天接入（data 层替换即可）
    ============================================================
  -->

  <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F2EFE9;
      --bg-soft: #E8E3D8;
      --ink: #3C3733;
      --ink-soft: #6E6760;
      --line: #D8D1C5;
      --accent: #C09D9B;
      --accent-deep: #A67D7A;
      --on-accent: #332E2B;
      --correct: #94A98F;
      --correct-deep: #7D9378;
      --wrong: #CC9D99;
      --wrong-deep: #B46F6A;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Instrument Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    html, body { height: 100%; width: 100%; overflow-x: hidden; }
    *, *::before, *::after { min-width: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; }

    .nav { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 0 22px; border-bottom: 1px solid var(--line);  flex-wrap: wrap; gap: 10px 18px;}
    .wordmark { font-family: var(--serif); font-style: italic; font-size: 25px; display: inline-flex; align-items: center; min-height: 44px; }
    .nav-note { font-size: 13px; color: var(--ink-soft); }

    .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: var(--ink-soft); display: block; }

    /* --- Intro --- */
    .intro { padding: 72px 0 48px; }
    .intro h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(36px, 5vw, 54px); line-height: 1.1; margin: 20px 0 18px; }
    .intro h1 em { font-style: italic; color: var(--accent); }
    .intro p { color: var(--ink-soft); line-height: 1.7; max-width: 34em; margin-bottom: 14px; }
    .intro .meta { display: flex; gap: 28px; margin: 28px 0 36px; font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
    .intro-return { border-left: 2px solid var(--accent); background: var(--bg-soft); padding: 16px 20px; margin: 20px 0 26px; font-size: 15px; line-height: 1.6; }
    .intro-return p:last-child { margin-bottom: 0; }

    /* --- Question --- */
    .quiz { padding: 48px 0 72px; }
    .quiz-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .quiz-progress-label { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
    .quiz-code { font-family: var(--mono); font-size: 13px; color: var(--accent); }
    .progress-track { height: 2px; background: var(--line); margin-bottom: 40px; position: relative; }
    .progress-fill { height: 2px; background: var(--accent); transition: width 0.3s ease; }
    .quiz h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.35; margin-bottom: 30px; }
    .opt {
      display: block; width: 100%; text-align: left;
      background: transparent; border: 1px solid var(--line);
      padding: 16px 20px; margin-bottom: 12px;
      font-family: var(--sans); font-size: 15px; line-height: 1.55; color: var(--ink);
      cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
    }
    .opt:hover { border-color: var(--accent); }
    .opt.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
    .opt.correct { border-color: var(--correct); background: color-mix(in srgb, var(--correct) 16%, var(--bg)); }
    .opt.correct .opt-key { color: var(--correct-deep); }
    .opt.wrong { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 16%, var(--bg)); }
    .opt.wrong .opt-key { color: var(--wrong-deep); }
    .opt .opt-key { font-family: var(--mono); color: var(--accent); margin-right: 10px; font-size: 13px; }
    .explain {
      margin-top: 6px; padding: 16px 20px;
      border-left: 2px solid var(--accent);
      background: var(--bg-soft);
      font-size: 14px; line-height: 1.65; color: var(--ink-soft);
    }
    .explain strong { color: var(--ink); }
    .quiz-actions { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; }

    .btn-primary {
      background: var(--accent); color: var(--on-accent);
      border: none; padding: 14px 28px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.18s ease;
    }
    .btn-primary:hover { background: var(--accent-deep); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .btn-text {
      background: none; border: none; color: var(--ink-soft);
      font-family: var(--sans); font-size: 14px; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .btn-text:hover { color: var(--ink); }

    /* --- Report --- */
    .report { padding: 56px 0 80px; }
    .report .score-head { display: flex; align-items: baseline; gap: 18px; margin: 18px 0 8px; flex-wrap: wrap; }
    .report .big-score { font-family: var(--mono); font-size: 64px; color: var(--accent); line-height: 1; }
    .report .score-caption { font-size: 14px; color: var(--ink-soft); max-width: 30em; }
    .report h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.2; }
    .report h2 em { font-style: italic; color: var(--accent); }
    .report .section-label { margin-top: 44px; }

    .subtest-report { margin-top: 18px; border-top: 1px solid var(--line); }
    .subtest-line {
      display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: center;
      padding: 16px 0; border-bottom: 1px solid var(--line);
    }
    .subtest-line .code { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
    .subtest-line .name { font-family: var(--serif); font-size: 18px; }
    .subtest-line .name .weak { font-style: italic; color: var(--accent); }
    .bar-track { height: 4px; background: var(--line); position: relative; }
    .subtest-line .bar-track { grid-column: 2 / 4; }
    .bar-fill { height: 4px; background: var(--accent); }
    .subtest-line .acc { font-family: var(--mono); font-size: 13px; color: var(--ink); }
    .weak-note {
      margin: 20px 0 8px; font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--ink);
    }
    .weak-note em { color: var(--accent); }

    /* --- Paywall --- */
    .paywall {
      margin-top: 40px; border: 1px solid var(--line); padding: 0 28px 28px;
      background: var(--bg-soft);
    }
    .paywall .locked-head { display: flex; justify-content: space-between; align-items: baseline; padding-top: 24px; }
    .lock-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--accent); }
    .locked-content { filter: blur(5px); user-select: none; pointer-events: none; margin-top: 18px; }
    .locked-content .mock-line { height: 14px; background: var(--line); margin: 10px 0; }
    .locked-content .mock-line.w70 { width: 70%; }
    .locked-content .mock-line.w50 { width: 50%; }
    .paywall .cta-row { display: flex; gap: 16px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
    .paywall .price { font-family: var(--mono); font-size: 20px; }
    .paywall .price small { font-size: 13px; color: var(--ink-soft); }
    .paywall .demo-note { font-size: 12px; color: var(--ink-soft); margin-top: 14px; }

    /* --- Email collection form --- */
    .pw-form { margin-top: 18px; }
    .pw-field { margin-bottom: 14px; }
    .pw-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
    .pw-input { width: 100%; padding: 12px 14px; font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); outline: none; transition: border-color .15s ease; }
    .pw-input:focus { border-color: var(--accent); }
    .pw-error { font-size: 12px; color: var(--accent-deep); margin-top: 6px; }
    .pw-privacy { font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height: 1.6; }
    .pw-success { margin: 6px 0 0; font-size: 13px; color: var(--ink); }

    /* --- Learn mode --- */
    .learn { padding: 40px 0 72px; }
    .learn-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 26px 0 24px; }
    .learn-tab { background: none; border: none; padding: 12px 20px; font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
    .learn-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
    .learn-tab:hover { color: var(--ink); }
    .learn-summary { border-left: 2px solid var(--accent); background: var(--bg-soft); padding: 16px 20px; margin-bottom: 22px; font-size: 15px; line-height: 1.6; }
    .task-progress { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
    .card-item { border-top: 1px solid var(--line); padding: 16px 0; }
    .card-q { font-family: var(--serif); font-size: 18px; line-height: 1.4; margin-bottom: 8px; }
    .card-reveal { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
    .card-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-sm { padding: 9px 16px; font-size: 13px; }
    .btn-ghost { background: none; border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; font-size: 13px; cursor: pointer; }
    .btn-ghost:hover { border-color: var(--ink); }
    .done-tag { font-family: var(--mono); font-size: 12px; color: var(--accent-deep); }

    .unlocked-box { margin-top: 40px; }
    .unlocked-box h3 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin-bottom: 14px; }
    .unlocked-box h3 em { color: var(--accent); }
    .plan-item { display: flex; gap: 14px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.55; }
    .plan-item .day { font-family: var(--mono); font-size: 13px; color: var(--accent); flex-shrink: 0; }

    .footer { padding: 40px 0 56px; border-top: 1px solid var(--line); }
    .footer p { font-size: 12px; color: var(--ink-soft); line-height: 1.7; max-width: 60em; margin-top: 24px; }

    @media (max-width: 620px) {
      .nav { gap: 8px 14px; }

      .nav-cta { font-size: 13px; }

      .nav-btn { padding: 5px 10px; font-size: 13px; }

      .nav-email { display: none; }
      .wrap { padding: 0 50px; }
      .nav-note { display: none; }
      .intro { padding: 48px 0 36px; }
      .intro h1 { font-size: clamp(30px, 8vw, 38px); line-height: 1.15; }
      .intro p { font-size: 15px; }
      .intro .meta { flex-wrap: wrap; gap: 10px 22px; margin: 22px 0 30px; }
      .quiz { padding: 32px 0 56px; }
      .quiz h2 { font-size: 20px; line-height: 1.4; }
      .opt { padding: 14px 16px; font-size: 14px; line-height: 1.5; }
      .explain { font-size: 13px; padding: 14px 16px; }
      .quiz-actions { gap: 12px; }
      .quiz-actions .btn-primary { flex: 1; }
      .report { padding: 40px 0 64px; }
      .report .big-score { font-size: 52px; }
      .report .score-caption { font-size: 13px; }
      .subtest-line { grid-template-columns: 52px 1fr; gap: 10px; padding: 13px 0; }
      .subtest-line .acc { grid-column: 2; }
      .subtest-line .bar-track { grid-column: 1 / -1 !important; }
      .weak-note { font-size: 17px; line-height: 1.5; }
      .paywall { padding: 0 22px 22px; }
      .plan-item { font-size: 14px; gap: 10px; }
      .footer p { font-size: 11px; }
      p, h1, h2, h3, .opt, .explain, .plan-item { overflow-wrap: break-word; }
    }
  </style>

<body>
  <div id="root"></div>

  <script src="questions.js"></script>
  <script src="js/auth.js"></script>
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    // ============ QUESTION BANK (original, blueprint-aligned) ============
    // 来源: Hermes + praxis-question-writer skill, 基于 ETS 官方 Study Companion 大纲
    // 科目代码按官方: 5002 = Reading & Language Arts, 5003 = Mathematics,
    //                 5004 = Social Studies, 5005 = Science
    // 每次诊断从 DM_BANK 随机抽取（每科 3 题），见 DM_drawSession · 题库 86 题（template3，官方蓝图）
    const DM_BANK = window.DM_BANK_EXT || []; // 题库来自 questions.js（build-questions-js.js 生成）

    // Draw a session: perSubtest items per subtest, then shuffle across all four
    function DM_drawSession(bank, perSubtest) {
      const groups = {};
      bank.forEach(q => { (groups[q.code] = groups[q.code] || []).push(q); });
      const picked = [];
      Object.keys(groups).forEach(code => {
        const arr = groups[code].slice();
        const n = Math.min(perSubtest, arr.length);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        picked.push(...arr.slice(0, n));
      });
      for (let i = picked.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [picked[i], picked[j]] = [picked[j], picked[i]];
      }
      return picked;
    }

    // mock scaled-score model (demo only)
    function DM_estimateScore(subtestAccs) {
      // per-subtest: acc 0..1 -> ~140..180; average of four
      const per = subtestAccs.map(a => 140 + a * 40);
      const avg = per.reduce((x, y) => x + y, 0) / per.length;
      return { per, avg: Math.round(avg) };
    }
    function DM_passProbability(avgScore) {
      // mock: 160 is demo passing line; 140..180 maps to 5%..95%
      return Math.max(5, Math.min(95, Math.round(5 + (avgScore - 140) * 2.25)));
    }

    function DM_Nav() {
      return (
        <header className="nav wrap">
          <a className="wordmark" href="/" aria-label="Triumph home" style={{textDecoration:'none', color:'inherit'}}>Triumph<span style={{color:'var(--accent)'}}>.</span></a>
          <div style={{display:'flex', gap:20, alignItems:'baseline'}}>
            <span className="nav-note">Practice · instant feedback</span>
            <a className="nav-cta" href="/">Home</a>
            <a className="nav-cta" href="/dashboard">Dashboard</a>
          </div>
        </header>
      );
    }

    function DM_Intro({ onStart }) {
      // 重访检测：之前解锁过？上次通过概率多少？
      const prevVisit = (() => {
        try {
          const at = Number(localStorage.getItem('triumph_unlocked_at') || 0);
          const pass = Number(localStorage.getItem('triumph_last_pass') || 0);
          if (at && pass) {
            const days = Math.max(0, Math.floor((Date.now() - at) / 86400000));
            return { days, pass };
          }
        } catch (e) {}
        return null;
      })();
      return (
        <section className="intro wrap">
          <span className="eyebrow">Free readiness diagnostic</span>
          <h1>Twelve questions. Eight minutes. <em>One honest answer.</em></h1>
          {prevVisit && (
            <div className="intro-return">
              <p><strong>Welcome back!</strong> Your last diagnostic showed a <span className="mono" style={{color:'var(--accent)'}}>{prevVisit.pass}%</span> pass probability{prevVisit.days > 0 ? ' · ' + prevVisit.days + ' day' + (prevVisit.days === 1 ? '' : 's') + ' ago' : ''}.</p>
              <p style={{marginBottom:0}}>Re-diagnose now and see how your score moves.</p>
            </div>
          )}
          <p>
            We draw twelve questions at random from our growing bank, sampling all four Praxis 5001
            subtests — reading &amp; language arts, mathematics, social studies, and science. At the end
            you&rsquo;ll get an estimated scaled score, your weakest gate, and a pass-probability forecast.
          </p>
          <p style={{marginBottom:0}}>No account. No payment. Original sample questions only.</p>
          <div className="meta">
            <span>12 random questions</span><span>≈ 8 min</span><span>4 subtests</span>
          </div>
          <button className="btn-primary" onClick={onStart}>Begin the diagnostic</button>
        </section>
      );
    }

    function DM_Quiz({ q, index, total, answered, selected, onSelect, onNext, onPrev, isLast }) {
      return (
        <section className="quiz wrap">
          <div className="quiz-top">
            <span className="quiz-progress-label">{index + 1} / {total}</span>
            <span className="quiz-code">{q.code}</span>
          </div>
          <div className="progress-track">
            <div className="progress-fill" style={{ width: (index / total * 100) + '%' }} />
          </div>
          <h2>{q.q}</h2>
          {q.options.map((opt, i) => {
            let cls = 'opt';
            if (answered && selected !== null) {
              if (i === q.answer) cls += ' correct';
              else if (i === selected) cls += ' wrong';
            } else if (selected === i) {
              cls += ' selected';
            }
            return (
              <button key={i} className={cls} onClick={() => !answered && onSelect(i)}>
                <span className="opt-key">{String.fromCharCode(65 + i)}</span>{opt}
              </button>
            );
          })}
          {answered && (
            <div className="explain"><strong>Why.</strong> {q.explain}</div>
          )}
          <div className="quiz-actions">
            <button className="btn-text" onClick={onPrev} disabled={index === 0} style={{visibility: index === 0 ? 'hidden' : 'visible'}}>← Back</button>
            <button className="btn-primary" onClick={onNext} disabled={!answered}>
              {isLast ? 'See my results' : 'Next question →'}
            </button>
          </div>
        </section>
      );
    }

    function DM_Report({ questions, answers, onRestart, onStartLearn }) {
      const accs = questions.map(q => ({ q, correct: answers[q.id] === q.answer }));
      const bySub = {};
      accs.forEach(({ q, correct }) => {
        if (!bySub[q.subtest]) bySub[q.subtest] = { code: q.code, total: 0, correct: 0 };
        bySub[q.subtest].total += 1;
        if (correct) bySub[q.subtest].correct += 1;
      });
      const subOrder = ['Reading and Language Arts', 'Mathematics', 'Social Studies', 'Science'];
      const subAccs = subOrder.map(s => bySub[s].correct / bySub[s].total);
      const { per, avg } = DM_estimateScore(subAccs);
      const passPct = DM_passProbability(avg);
      const weakestIdx = subAccs.indexOf(Math.min(...subAccs));

      const [pwStep, setPwStep] = useState(() => {
        // 已解锁用户（本设备留过邮箱）重诊时直接解锁，不再过付费墙
        try { return localStorage.getItem('triumph_unlocked_at') ? 'unlocked' : 'locked'; } catch (e) { return 'locked'; }
      });
      const [email, setEmail] = useState('');
      const [fname, setFname] = useState('');
      const [emailError, setEmailError] = useState('');

      const submitEmail = () => {
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
        if (!ok) { setEmailError('Please enter a valid email address.'); return; }
        setEmailError('');
        try {
          localStorage.setItem('triumph_email', email.trim());
          if (fname.trim()) localStorage.setItem('triumph_name', fname.trim());
          localStorage.setItem('triumph_unlocked_at', String(Date.now()));
        } catch (e) {}
        setPwStep('unlocked');
      };

      const [prevResult] = useState(() => {
        try {
          const s = Number(localStorage.getItem('triumph_last_score') || 0);
          const p = Number(localStorage.getItem('triumph_last_pass') || 0);
          return s > 0 ? { score: s, pass: p } : null;
        } catch (e) { return null; }
      });
      const savedResult = useRef(false);
      useEffect(() => {
        if (savedResult.current) return;
        savedResult.current = true;
        try {
          localStorage.setItem('triumph_last_score', String(avg));
          localStorage.setItem('triumph_last_pass', String(passPct));
          localStorage.setItem('triumph_last_completed_at', String(Date.now()));
        } catch (e) {}
      }, [avg, passPct]);

      return (
        <section className="report wrap">
          <span className="eyebrow">Your diagnostic report</span>
          {prevResult && (
            <p className="score-caption" style={{marginTop:6, padding:'10px 14px', background:'var(--bg-soft)', borderLeft:'2px solid var(--accent)'}}>
              <strong>Progress check:</strong> last diagnostic {prevResult.score} ({prevResult.pass}%) → now <span className="mono" style={{color:'var(--accent)'}}>{avg}</span> ({passPct}%)
              {avg > prevResult.score ? ' — improving.' : avg < prevResult.score ? ' — a dip; the plan adjusts below.' : ' — steady.'}
            </p>
          )}
          <div className="score-head">
            <span className="big-score">{avg}</span>
            <span className="score-caption">
              estimated scaled score · Praxis 5001 (demo model). Passing lines vary by state;
              a typical line sits near <strong>160</strong>.
            </span>
          </div>
          <p className="score-caption" style={{marginTop:6}}>
            Pass probability (demo): <span className="mono" style={{color:'var(--accent)'}}>{passPct}%</span> — at or above the passing line on {passPct >= 50 ? 'most' : 'fewer than half of'} simulations.
          </p>

          <div className="section-label">
            <span className="eyebrow">By subtest</span>
          </div>
          <div className="subtest-report">
            {subOrder.map((s, i) => {
              const acc = subAccs[i];
              const isWeak = i === weakestIdx;
              return (
                <div className="subtest-line" key={s}>
                  <span className="code">{bySub[s].code}</span>
                  <span className="name">{s}{isWeak ? ' — weakest gate' : ''}</span>
                  <span className="acc">{Math.round(acc * 100)}%</span>
                  <div className="bar-track">
                    <div className="bar-fill" style={{ width: Math.max(6, acc * 100) + '%' }} />
                  </div>
                </div>
              );
            })}
          </div>

          <p className="weak-note">
            Your weakest gate is <em>{subOrder[weakestIdx]}</em> — this is the subtest most likely to fail you
            on test day, and where most of your study time should go.
          </p>

          {/* ---- Paywall ---- */}
          <div className="paywall">
            <div className="locked-head">
              <span className="eyebrow" style={{margin:0}}>Pass forecast &amp; study plan</span>
              <span className="lock-tag">● TRIUMPH</span>
            </div>
            {pwStep === 'locked' ? (
              <div>
                <div className="locked-content">
                  <div className="mock-line w70" /><div className="mock-line" /><div className="mock-line w50" />
                </div>
                <div className="cta-row">
                  <button className="btn-primary" onClick={() => setPwStep('email')}>Unlock my pass forecast</button>
                  <span className="price">$15<small>/mo</small></span>
                </div>
                <p className="demo-note">
                  A real retake costs ~$130 and 28 days. The forecast costs less than a coffee a week.
                  (Prototype — payment not wired yet.)
                </p>
              </div>
            ) : pwStep === 'email' ? (
              <div>
                <p className="score-caption" style={{marginBottom:16}}>
                  Enter your email to unlock your <strong>pass forecast</strong> and <strong>personalized study plan</strong>.
                  Free to start — you'll see the full report immediately.
                </p>
                <div className="pw-form">
                  <div className="pw-field">
                    <label className="pw-label">Email</label>
                    <input className="pw-input" type="email" placeholder="you@example.com" value={email}
                      onChange={e => setEmail(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') submitEmail(); }} />
                    {emailError && <div className="pw-error">{emailError}</div>}
                  </div>
                  <div className="pw-field">
                    <label className="pw-label">First name <span style={{opacity:.6}}>(optional)</span></label>
                    <input className="pw-input" type="text" placeholder="Alex" value={fname}
                      onChange={e => setFname(e.target.value)} />
                  </div>
                  <div className="cta-row" style={{marginTop:18}}>
                    <button className="btn-primary" onClick={submitEmail}>Unlock my pass forecast</button>
                    <span className="price">$15<small>/mo</small></span>
                  </div>
                  <p className="pw-privacy">
                    14-day free trial · cancel anytime · we never share your email.
                    (Prototype: this demo saves your email to this browser only — nothing is sent anywhere yet.)
                  </p>
                </div>
              </div>
            ) : (
              <div className="unlocked-box" style={{marginTop:24}}>
                <h3>{fname.trim() ? 'Welcome, ' + fname.trim() + ' — ' : 'Welcome — '}here's your pass forecast <em>(unlocked)</em></h3>
                <p className="score-caption" style={{marginBottom:16}}>
                  Based on this diagnostic, we estimate a <span className="mono" style={{color:'var(--accent)'}}>{passPct}%</span>
                  chance of passing at your current level. Your weakest gate ({subOrder[weakestIdx]}) should get
                  about 60% of your study time. Sample week:
                </p>
                <div className="plan-item"><span className="day">MON</span> 5003 Mathematics — fractions &amp; decimals (20 min) + 8 practice questions</div>
                <div className="plan-item"><span className="day">TUE</span> {subOrder[weakestIdx]} — targeted review of missed concepts (25 min)</div>
                <div className="plan-item"><span className="day">WED</span> Mixed 10-question set across all four subtests</div>
                <div className="plan-item"><span className="day">THU</span> {subOrder[weakestIdx]} — timed micro-quiz (10 questions, 12 min)</div>
                <div className="plan-item"><span className="day">FRI</span> 5002 Reading &amp; Language Arts — vocabulary &amp; phonics review</div>
                <div className="plan-item"><span className="day">SAT</span> Full simulated subtest, timed, no notes</div>
                <div className="plan-item"><span className="day">SUN</span> Rest + re-diagnose to measure improvement</div>
                <p className="pw-privacy" style={{marginTop:18, marginBottom:0}}>
                  <strong>Come back next week.</strong> Re-run this diagnostic in 7 days and watch your pass probability move —
                  your score history is saved on this device so you can compare.
                </p>
                <div className="cta-row" style={{marginTop:20}}>
                  <button className="btn-primary" onClick={onStartLearn}>Start your daily study →</button>
                  <button className="btn-ghost" onClick={onRestart}>Re-run diagnostic</button>
                  <span className="demo-note" style={{margin:0}}>Prototype — real accounts &amp; billing pending.</span>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

    function DM_Learn({ weakestCode, weakestName, onBack, onRestart }) {
      const [tab, setTab] = useState('tasks'); // tasks | cards | progress

      // ---- 今日任务：抽 8 题，weakest 优先 ----
      const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };
      const [taskQs, setTaskQs] = useState(() => {
        const weak = shuffle(DM_BANK.filter(q => q.code === weakestCode));
        const rest = shuffle(DM_BANK.filter(q => q.code !== weakestCode));
        return [...weak.slice(0, 5), ...rest.slice(0, 3)].slice(0, 8);
      });
      const [tIndex, setTIndex] = useState(0);
      const [tSelected, setTSelected] = useState(null);
      const [tAnswered, setTAnswered] = useState(false);
      const [tDone, setTDone] = useState(0);
      const [tCorrect, setTCorrect] = useState(0);
      const [wrongIds, setWrongIds] = useState([]);

      const tq = taskQs[tIndex];
      const selectTask = i => {
        if (tAnswered) return;
        setTSelected(i); setTAnswered(true);
        if (i === tq.answer) setTCorrect(c => c + 1);
        else setWrongIds(w => [...w, tq.id]);
      };
      const nextTask = () => {
        setTDone(d => d + 1);
        if (tIndex < taskQs.length - 1) { setTIndex(tIndex + 1); setTSelected(null); setTAnswered(false); }
        else setTab('cards');
      };

      // ---- 记忆卡：错题 + 复习调度（简化 SRS：第1天/已复习） ----
      const cardIds = [...new Set(wrongIds)];
      const cardQs = cardIds.map(id => DM_BANK.find(q => q.id === id)).filter(Boolean);
      const [reviewed, setReviewed] = useState(() => {
        try { return JSON.parse(localStorage.getItem('triumph_reviewed') || '[]'); } catch (e) { return []; }
      });
      const markReviewed = id => {
        const next = reviewed.includes(id) ? reviewed : [...reviewed, id];
        setReviewed(next);
        try { localStorage.setItem('triumph_reviewed', JSON.stringify(next)); } catch (e) {}
      };

      return (
        <section className="learn wrap">
          <span className="eyebrow">Learning mode · {weakestName} is your weakest gate</span>
          <h2 style={{fontFamily:'var(--serif)', fontWeight:400, fontSize:'clamp(26px,3.4vw,34px)', lineHeight:1.2, marginTop:10}}>
            {tab === 'tasks' && 'Today\u2019s tasks'}
            {tab === 'cards' && 'Memory cards'}
            {tab === 'progress' && 'Your progress'}
          </h2>
          <div className="learn-tabs">
            <button className={'learn-tab' + (tab === 'tasks' ? ' active' : '')} onClick={() => setTab('tasks')}>Tasks</button>
            <button className={'learn-tab' + (tab === 'cards' ? ' active' : '')} onClick={() => setTab('cards')}>Cards ({cardQs.length})</button>
            <button className={'learn-tab' + (tab === 'progress' ? ' active' : '')} onClick={() => setTab('progress')}>Progress</button>
          </div>

          {tab === 'tasks' && (
            <div>
              {tIndex < taskQs.length ? (
                <div>
                  <div className="task-progress">Task {tIndex + 1} / {taskQs.length} · focus: {weakestName}</div>
                  <DM_Quiz q={tq} index={tIndex} total={taskQs.length} answered={tAnswered} selected={tSelected}
                    onSelect={selectTask} onNext={nextTask} onPrev={() => {}} isLast={false} />
                </div>
              ) : null}
            </div>
          )}

          {tab === 'cards' && (
            <div>
              {cardQs.length === 0 ? (
                <p className="score-caption">No missed questions yet — do today's tasks first, then review what you got wrong.</p>
              ) : cardQs.map(c => {
                const done = reviewed.includes(c.id);
                return (
                  <div className="card-item" key={c.id}>
                    <div className="card-q">{c.q}</div>
                    {done ? (
                      <p className="card-reveal">Correct answer: <strong>{c.options[c.answer]}</strong> · {c.explain} <span className="done-tag">✓ reviewed {new Date().toLocaleDateString('en-US')}</span></p>
                    ) : (
                      <div>
                        <button className="btn-sm btn-primary" style={{padding:'9px 16px'}} onClick={() => setTab('tasks')}>Back to tasks</button>
                        <button className="btn-sm btn-ghost" onClick={() => { alert('Answer: ' + c.options[c.answer] + '\n\n' + c.explain); markReviewed(c.id); }}>Reveal answer</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {tab === 'progress' && (
            <div>
              <div className="learn-summary">
                <p><strong>Today:</strong> {tDone} of {taskQs.length} tasks completed · {tCorrect} correct</p>
                <p style={{marginBottom:0}}><strong>Pass probability:</strong> re-run the diagnostic next week to see how it moves — your score history is saved on this device.</p>
              </div>
              <div className="cta-row">
                <button className="btn-primary" onClick={onRestart}>New diagnostic</button>
                <button className="btn-ghost" onClick={onBack}>Back to report</button>
              </div>
            </div>
          )}
        </section>
      );
    }

    function DM_App() {
      const params = new URLSearchParams(window.location.search);
      const todayMode = params.get('mode') === 'today';
      const [sub, setSub] = useState(params.get('subtest') || 'ALL');
      const [count, setCount] = useState(10);
      const [session, setSession] = useState(null); // null = 未开始
      const [qIndex, setQIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [stats, setStats] = useState({ right: 0, wrong: 0 });
      const [savedToday, setSavedToday] = useState(false);

      const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };

      const begin = () => {
        let pool;
        if (todayMode) {
          // 今日任务：弱门优先（triumph_weakest），共 10 题（弱门 6 + 其他 4）
          const weak = (() => { try { return localStorage.getItem('triumph_weakest') || '5003'; } catch (e) { return '5003'; } })();
          const w = shuffle(DM_BANK.filter(q => q.code === weak)).slice(0, 6);
          const r = shuffle(DM_BANK.filter(q => q.code !== weak)).slice(0, 4);
          pool = [...w, ...r];
        } else {
          pool = sub === 'ALL' ? DM_BANK.slice() : DM_BANK.filter(q => q.code === sub);
        }
        const n = Math.min(todayMode ? 10 : count, pool.length);
        setSession(shuffle(pool).slice(0, n));
        setQIndex(0); setSelected(null); setAnswered(false); setStats({ right: 0, wrong: 0 }); setSavedToday(false);
      };

      const q = session ? session[qIndex] : null;
      const done = session && qIndex >= session.length;
      const total = session ? session.length : 0;

      // 今日任务完成 → 写 localStorage（dashboard 读进度）
      if (done && todayMode && !savedToday) {
        setSavedToday(true);
        try {
          localStorage.setItem('triumph_today', JSON.stringify({
            date: new Date().toISOString().slice(0, 10), total, done: total, right: stats.right,
          }));
          if (window.TriumphAuth && window.TriumphAuth.isLoggedIn()) {
            const st = window.TriumphAuth.buildLocalState();
            window.TriumphAuth.saveState(st).catch(() => {});
          }
        } catch (e) {}
      }

      const select = i => {
        if (!q || answered) return;
        setSelected(i); setAnswered(true);
        const correct = i === q.answer;
        setStats(s => ({ right: s.right + (correct ? 1 : 0), wrong: s.wrong + (correct ? 0 : 1) }));
        // 熟练度数据：记录每次作答（按知识点归因）
        try {
          const arr = JSON.parse(localStorage.getItem('triumph_answers') || '[]');
          arr.push({ qid: q.id, sub: q.code, category: q.category || '', correct, ts: Date.now() });
          localStorage.setItem('triumph_answers', JSON.stringify(arr.slice(-500)));
          // 登录用户：同步一条答题到云端
          if (window.TriumphAuth && window.TriumphAuth.isLoggedIn()) {
            const state = window.TriumphAuth.buildLocalState();
            state.answers = arr.slice(-500);
            window.TriumphAuth.saveState(state).catch(() => {});
          }
        } catch (e) {}
      };
      const next = () => {
        if (qIndex < total - 1) { setQIndex(qIndex + 1); setSelected(null); setAnswered(false); }
        else setQIndex(qIndex + 1); // 触发 done
      };
      const again = () => { setSession(null); setSub(params.get('subtest') || 'ALL'); setStats({ right: 0, wrong: 0 }); };

      const SUB_NAMES = { 'ALL': 'All subtests', '5002': 'Reading & Language Arts', '5003': 'Mathematics', '5004': 'Social Studies', '5005': 'Science' };

      return (
        <div>
          <DM_Nav />
          <main>
          <section className="intro wrap">
            <span className="eyebrow">{todayMode ? 'Today\u2019s tasks' : 'Practice mode'}</span>
            <h1 style={{fontFamily:'var(--serif)',fontWeight:400,fontSize:'clamp(32px,4.5vw,46px)',lineHeight:1.12,margin:'16px 0 10px'}}>
              {todayMode ? <span>Your daily set, <em>focused on your weakest gate.</em></span> : <span>Drill the questions. <em>No score report, no pressure.</em></span>}
            </h1>
            <p style={{color:'var(--ink-soft)',lineHeight:1.7,maxWidth:'34em',marginBottom:8}}>
              {todayMode
                ? 'Ten questions — six from your weakest subtest, four mixed. Finish them and your progress shows on your dashboard.'
                : 'Pick a subtest and a set size — answers and explanations appear instantly so you can learn as you go.'}
            </p>

            {!session ? (
              <div style={{marginTop:28}}>
                <div className="learn-tabs" style={{marginBottom:22}}>
                  {Object.keys(SUB_NAMES).map(s => (
                    <button key={s} className={'learn-tab' + (sub === s ? ' active' : '')} onClick={() => setSub(s)}>{s === 'ALL' ? 'All' : s}</button>
                  ))}
                </div>
                <div style={{display:'flex', gap:10, alignItems:'center', flexWrap:'wrap', marginBottom:26}}>
                  <span className="eyebrow" style={{marginBottom:0}}>Set size:</span>
                  {[10, 20, 30].map(n => (
                    <button key={n} className={'btn-sm btn-primary' + (count === n ? '' : ' btn-ghost')}
                      style={count === n ? {padding:'9px 16px'} : {padding:'9px 16px'}} onClick={() => setCount(n)}>{n}</button>
                  ))}
                </div>
                <button className="btn-primary" onClick={begin}>Start practicing — {SUB_NAMES[sub]}</button>
              </div>
            ) : !done ? (
              <div style={{marginTop:8}}>
                <div className="task-progress">
                  Question {qIndex + 1} / {total} · {SUB_NAMES[sub]} · <span style={{color:'var(--accent-deep)'}}>{stats.right} right</span> / <span style={{color:'var(--ink-soft)'}}>{stats.wrong} wrong</span>
                </div>
                <DM_Quiz q={q} index={qIndex} total={total} answered={answered} selected={selected}
                  onSelect={select} onNext={next} onPrev={() => {}} isLast={false} />
              </div>
            ) : (
              <div style={{marginTop:28}}>
                <div className="learn-summary">
                  <p><strong>Set complete.</strong> {stats.right} of {total} correct ({Math.round(stats.right / total * 100)}%){stats.right === total ? ' — flawless!' : ''}</p>
                  <p style={{marginBottom:0}}>Keep going: review your misses in the answer keys above, or start another set.</p>
                </div>
                <div className="cta-row">
                  <button className="btn-primary" onClick={again}>New set</button>
                  <a className="btn-ghost" href="dashboard" style={{textDecoration:'none',display:'inline-block',padding:'9px 16px'}}>Back to dashboard</a>
                </div>
              </div>
            )}
          </section>
          </main>
          <footer className="footer wrap">
            <p>
              Triumph is an independent study tool. Not affiliated with, endorsed by, or sponsored by ETS.
              Sample questions are original demonstrations and are not official Praxis items.
            </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DM_App />);
  </script>
</body>
</html>
