    const A_BODY = (

        <span className="eyebrow">Study guide · Praxis 5001</span>
        <h1>Praxis 5001 Study Guide: What's Actually on All Four Subtests</h1>
        <div className="meta-line">Reading time: 6 min · Based on the official ETS Study Companion</div>

        <p>The Praxis 5001 — <em>Elementary Education: Multiple Subjects</em> — is not one exam. It is <strong>four separate tests</strong>, each scored independently, and you must pass all four to earn your license. Candidates who treat it as "one exam" are the ones who discover, too late, that they failed a single gate.</p>

        <p>This guide breaks down the official structure of all four subtests — what's on them, how they're weighted, and how the scoring rules change the way you should study. It's built from the ETS Study Companion, not from guesswork.</p>

        <div className="callout">
          <p><strong>The one fact that changes everything:</strong> the 5001 scores each subtest separately. Score high on math and fail science — you don't pass. You retake <em>science only</em>, full price, 28 days later. Your study plan should be built around your weakest gate, not around "averaging out" across four subjects.</p>
        </div>

        <h2>The four gates, at a glance</h2>
        <table>
          <thead>
            <tr><th>Subtest</th><th>Questions</th><th>Time</th><th>Formats</th></tr>
          </thead>
          <tbody>
            <tr><td><code>5002</code> Reading &amp; Language Arts</td><td>80</td><td>90 min</td><td>Selected-response</td></tr>
            <tr><td><code>5003</code> Mathematics</td><td>50</td><td>65 min</td><td>Selected-response, numeric-entry</td></tr>
            <tr><td><code>5004</code> Social Studies</td><td>60</td><td>60 min</td><td>Selected-response</td></tr>
            <tr><td><code>5005</code> Science</td><td>55</td><td>60 min</td><td>Selected-response</td></tr>
          </tbody>
        </table>
        <p>Total: 245 questions across 4 hours 35 minutes. Each subtest is timed and scored separately — there is no combined "total score" that saves you.</p>

        <h2>5002 · Reading &amp; Language Arts <em>(80 questions, 90 minutes)</em></h2>
        <p>This subtest assesses what an entry-level elementary teacher needs to teach reading and writing. It breaks into two content categories:</p>
        <ul>
          <li><strong>Reading — about 38 questions (47%)</strong>: phonemic awareness and phonics, word recognition, vocabulary, reading comprehension, and the skills teachers use to develop them in children.</li>
          <li><strong>Writing, Speaking, and Listening — about 42 questions (53%)</strong>: the writing process, conventions of standard English, and the instructional knowledge behind teaching writing and oral language.</li>
        </ul>
        <p>What surprises candidates most: this is a <em>teaching</em> exam. You need to know the reading research — phoneme awareness, decoding, the difference between assessment and diagnosis — not just read well yourself.</p>

        <h2>5003 · Mathematics <em>(50 questions, 65 minutes)</em></h2>
        <p>The math subtest is shorter than reading but covers a wide band, and it includes <strong>numeric-entry questions</strong> where you type an answer rather than choose it:</p>
        <ul>
          <li><strong>Numbers and Operations — 20 questions (40%)</strong>: number sense, place value, fractions, decimals, percents, ratios, and operations.</li>
          <li><strong>Algebraic Thinking — 15 questions (30%)</strong>: patterns, expressions, equations, functions, and proportional reasoning.</li>
          <li><strong>Geometry and Measurement, Data, Statistics, and Probability — 15 questions (30%)</strong>: shapes, measurement, data displays, probability, and how to teach them.</li>
        </ul>
        <p>Two things trip candidates up here. First, roughly a third of the items are <strong>mathematics pedagogy</strong> — "a student confuses 3/8 and 1/2, which representation helps them see the error?" — not computation. Second, many candidates haven't touched this content in years; the math is elementary-level, but fluency matters under a 65-minute clock.</p>

        <h2>5004 · Social Studies <em>(60 questions, 60 minutes)</em></h2>
        <p>Sixty questions in sixty minutes — the tightest pace of the four. Content categories:</p>
        <ul>
          <li><strong>United States History, Government, and Citizenship — 27 questions (45%)</strong>: the Constitution, branches of government, key eras and figures, citizenship.</li>
          <li><strong>Geography, Anthropology, and Sociology — 18 questions (30%)</strong>: physical and human geography, culture, and how people interact with place.</li>
          <li><strong>World History and Economics — 15 questions (25%)</strong>: major world civilizations, and basic economic concepts like opportunity cost and markets.</li>
        </ul>
        <p>The breadth is the challenge: US history alone spans colonial era to today. Expect questions that ask about <em>teaching</em> these topics — like choosing an activity that helps students analyze why a city grew beside a river.</p>

        <h2>5005 · Science <em>(55 questions, 60 minutes)</em></h2>
        <p>Science splits nearly evenly across three domains:</p>
        <ul>
          <li><strong>Earth Science — about 17–18 questions (~33%)</strong>: the water cycle, weather, rocks and soil, space.</li>
          <li><strong>Life Science — about 18–19 questions (~33%)</strong>: cells, organisms, ecosystems, plant and animal life.</li>
          <li><strong>Physical Science — about 18–19 questions (~33%)</strong>: matter, energy, forces, motion, and simple machines.</li>
        </ul>
        <p>Beyond content, expect <strong>science inquiry and pedagogy</strong> items — controlling variables in an investigation, designing a fair test, interpreting observations. Community reports consistently list science among the hardest gates, largely because the knowledge surface is wide and most adults haven't reviewed it in years.</p>

        <h2>Scoring: the rule that reshapes your study plan</h2>
        <p>Each subtest produces its own scaled score, typically reported on a 100–200 scale. Passing lines <strong>vary by state</strong> and by subtest — commonly between 150 and 165, sometimes higher. What that means practically:</p>
        <ul>
          <li>You need four passing scores, not one good average.</li>
          <li>If you fail one subtest, you retake only that one — but you pay the full subtest fee and wait at least 28 days between attempts.</li>
          <li>Your <strong>weakest gate determines whether you pass</strong>. Studying all four equally is the single most common pattern among candidates who retake.</li>
        </ul>

        <div className="callout">
          <p><strong>Reality check from the data:</strong> national research (NCTQ) has found that a majority of first-time elementary teacher candidates do not pass the most widely used licensure exam, and first-time pass rates have been reported <em>below the bar exam</em>. This is a genuinely hard, high-stakes test — not a formality.</p>
        </div>

        <h2>How to use this structure (smarter, not harder)</h2>
        <ol>
          <li><strong>Diagnose first.</strong> Before you touch a study guide, get a baseline: which of the four gates is already near passing, and which is far below? Candidates who spend ~60% of their time on the weakest gate pass more reliably than candidates who "cover everything."</li>
          <li><strong>Learn the pedagogy items.</strong> All four subtests mix content with teaching knowledge. Flash-card the terminology (phoneme, opportunity cost, controlled variable) — these are often the difference between a 158 and a 163.</li>
          <li><strong>Practice under the clock.</strong> 5004 gives you one minute per question. 5003 adds numeric entry. If you've never timed a full subtest, you'll feel it on test day.</li>
          <li><strong>Know your state's passing line</strong> and aim above it with margin — don't aim at the minimum.</li>
        </ol>

        <p><strong>Ready to find out which gate is your weakest?</strong> Our free 12-question diagnostic samples all four subtests and estimates your scaled score against a typical passing line — no account, no cost.</p>
