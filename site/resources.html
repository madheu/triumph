    * { box-sizing: border-box; margin: 0; padding: 0; }
    *, *::before, *::after { min-width: 0; }
    :root {

      --line: #D8D1C5; --accent: #C09D9B; --accent-deep: #A67D7A; --on-accent: #332E2B;

      --mono: "JetBrains Mono", ui-monospace, monospace;

    html, body { height: 100%; width: 100%; overflow-x: hidden; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { text-wrap: balance; }
    p, li { overflow-wrap: break-word; }

    .nav { display: flex; align-items: baseline; justify-content: space-between; padding: 28px 0 24px; border-bottom: 1px solid var(--line);  flex-wrap: wrap; gap: 10px 18px;}
    .wordmark { font-family: var(--serif); font-style: italic; font-size: 26px; display: inline-flex; align-items: center; min-height: 44px; }
    .nav-note { font-size: 13px; color: var(--ink-soft); }
    .nav-cta { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
    @media (max-width: 760px) { .nav-note { display: none; } }

    .header { padding: 72px 0 40px; }
    .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 20px; }
    .header h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(36px, 5vw, 54px); line-height: 1.1; margin-bottom: 18px; }
    .header h1 em { font-style: italic; color: var(--accent); }
    .header p { color: var(--ink-soft); line-height: 1.7; max-width: 34em; }

    .post { display: grid; grid-template-columns: 110px 1fr; gap: 24px; padding: 30px 0; border-top: 1px solid var(--line); }
    .post:last-of-type { border-bottom: 1px solid var(--line); }
    .post-date { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); padding-top: 6px; }
    .post h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.3; margin-bottom: 8px; }
    .post h2 a { color: var(--ink); text-decoration: none; }
    .post h2 a:hover { color: var(--accent-deep); }
    .post p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
    .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent-deep); text-transform: uppercase; margin-right: 10px; }
    .draft { opacity: 0.55; }
    .draft .post-date::after { content: " · coming soon"; color: var(--accent); }

    .footer { padding: 48px 0 64px; }
    .footer p { font-size: 12px; color: var(--ink-soft); line-height: 1.7; max-width: 60em; }

    @media (max-width: 620px) {
